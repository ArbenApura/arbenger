<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Color Picker — Arbenger</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }

		body {
			--bg: #0B0A23;
			--surface: #1E1A5E;
			--border: #2A2578;
			--cyan: #22D3EE;
			--cyan-hover: #67E8F9;
			--teal: #2DD4BF;
			--text: #CBD5E1;
			--text-muted: #94A3B8;
			--text-heading: #FFFFFF;
			--red: #F87171;
			--green: #4ADE80;
			--amber: #FBBF24;
			--glow: rgba(34, 211, 238, 0.25);
			--glow-soft: rgba(34, 211, 238, 0.1);
			--checker-1: transparent;
			--checker-2: #374151;

			width: 310px;
			max-height: 480px;
			background: var(--bg);
			color: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
			font-size: 13px;
			overflow: hidden;
			display: flex;
			flex-direction: column;
			transition: background 0.2s, color 0.2s;
		}

		#main {
			flex: 1;
			display: flex;
			flex-direction: column;
			overflow: hidden;
			min-height: 0;
		}

		body.light {
			--bg: #F8FAFC;
			--surface: #FFFFFF;
			--border: #E2E8F0;
			--text: #334155;
			--text-muted: #64748B;
			--text-heading: #161446;
			--checker-2: #D1D5DB;
		}

		:focus-visible {
			outline: 2px solid var(--cyan);
			outline-offset: 2px;
		}

		.mono { font-family: 'Courier New', monospace; }

		/* -- Header -- */
		.header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 8px 14px;
			border-bottom: 1px solid var(--border);
			flex-shrink: 0;
		}

		.header-title {
			font-weight: 700;
			font-size: 13px;
			color: var(--text-heading);
			letter-spacing: -0.025em;
		}

		.header-title span { color: var(--cyan); }

		.header-logo {
			width: 18px;
			height: 18px;
			flex-shrink: 0;
			margin-right: 2px;
			transition: all 0.2s;
		}

		.logo-bg { fill: #FFFFFF; }
		.logo-icon { fill: rgb(7, 28, 56); }

		body.light .logo-bg { fill: rgb(7, 28, 56); }
		body.light .logo-icon { fill: rgb(241, 253, 253); }

		.header-actions { display: flex; gap: 4px; }

		.icon-btn {
			background: none;
			border: 1px solid transparent;
			color: var(--text-muted);
			cursor: pointer;
			padding: 4px;
			border-radius: 6px;
			display: flex;
			align-items: center;
			transition: all 0.15s;
		}

		.icon-btn:hover {
			color: var(--cyan);
			background: var(--glow-soft);
			border-color: var(--border);
		}

		.icon-btn svg { width: 14px; height: 14px; }

		/* -- Pick Button -- */
		.pick-section { padding: 10px 14px; flex-shrink: 0; }

		.pick-btn {
			width: 100%;
			padding: 9px 14px;
			background: var(--cyan);
			color: var(--bg);
			border: none;
			border-radius: 8px;
			font-size: 13px;
			font-weight: 600;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 7px;
			transition: all 0.2s ease;
		}

		.pick-btn:hover {
			background: var(--cyan-hover);
			box-shadow: 0 0 20px var(--glow);
		}

		.pick-btn:active { transform: scale(0.98); }
		.pick-btn:disabled { opacity: 0.7; cursor: default; }
		.pick-btn:disabled:hover { box-shadow: none; background: var(--cyan); }
		.pick-btn svg { width: 15px; height: 15px; }

		/* -- Collapsible wrapper for everything below pick -- */
		.below-pick {
			flex: 1;
			overflow-y: auto;
			overflow-x: hidden;
			min-height: 0;
			opacity: 1;
			transition: opacity 0.2s ease;
		}

		body.picking .below-pick {
			flex: 0;
			opacity: 0;
			overflow: hidden;
		}

		body.picking .header-actions { opacity: 0; pointer-events: none; transition: opacity 0.15s; }
		body.picking .footer { border-top-color: transparent; }

		/* -- Color Result -- */
		.result { padding: 0 14px 10px; }

		.hidden { display: none !important; }

		.swatch-row {
			display: flex;
			align-items: center;
			gap: 10px;
			margin-bottom: 10px;
		}

		.swatch {
			width: 44px;
			height: 44px;
			border-radius: 10px;
			border: 2px solid var(--border);
			flex-shrink: 0;
			background-image:
				linear-gradient(45deg, var(--checker-2) 25%, var(--checker-1) 25%),
				linear-gradient(-45deg, var(--checker-2) 25%, var(--checker-1) 25%),
				linear-gradient(45deg, var(--checker-1) 75%, var(--checker-2) 75%),
				linear-gradient(-45deg, var(--checker-1) 75%, var(--checker-2) 75%);
			background-size: 12px 12px;
			background-position: 0 0, 0 6px, 6px -6px, -6px 0;
		}

		.swatch-inner { width: 100%; height: 100%; border-radius: 8px; }

		.swatch-hex {
			font-size: 18px;
			font-weight: 700;
			color: var(--text-heading);
		}

		/* -- Format Rows -- */
		.formats { display: flex; flex-direction: column; gap: 4px; }

		.format-row {
			display: flex;
			align-items: center;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: 7px;
			padding: 6px 10px;
			cursor: pointer;
			transition: all 0.15s ease;
		}

		.format-row:hover {
			border-color: var(--cyan);
			box-shadow: 0 0 10px var(--glow-soft);
		}

		.format-label {
			font-size: 10px;
			color: var(--text-muted);
			text-transform: uppercase;
			letter-spacing: 0.05em;
			min-width: 26px;
		}

		.format-value {
			font-size: 12px;
			color: var(--text-heading);
			flex: 1;
			margin-left: 6px;
		}

		.format-value.copied-text { color: var(--teal); }

		.copy-icon {
			width: 12px;
			height: 12px;
			color: var(--text-muted);
			transition: color 0.15s;
			flex-shrink: 0;
		}

		.format-row:hover .copy-icon { color: var(--cyan); }
		.format-row.copied { border-color: var(--teal); }
		.format-row.copied .copy-icon { color: var(--teal); }

		/* -- Collapsible Sections -- */
		.section { border-top: 1px solid var(--border); }

		.section-toggle {
			display: flex;
			align-items: center;
			justify-content: space-between;
			width: 100%;
			padding: 8px 14px;
			background: none;
			border: none;
			color: var(--text-muted);
			font-size: 10px;
			text-transform: uppercase;
			letter-spacing: 0.08em;
			cursor: pointer;
			transition: color 0.15s;
		}

		.section-toggle:hover { color: var(--text); }

		.section-toggle svg {
			width: 11px;
			height: 11px;
			transition: transform 0.2s;
		}

		.section-toggle.open svg { transform: rotate(180deg); }

		.section-body {
			padding: 0 14px 10px;
			display: none;
		}

		.section-body.open { display: block; }

		/* -- Harmonies -- */
		.harmony-group { margin-bottom: 8px; }
		.harmony-group:last-child { margin-bottom: 0; }

		.harmony-label {
			font-size: 10px;
			color: var(--text-muted);
			margin-bottom: 4px;
			text-transform: uppercase;
			letter-spacing: 0.05em;
		}

		.harmony-swatches { display: flex; gap: 3px; }

		.harmony-swatch {
			width: 26px;
			height: 26px;
			border-radius: 5px;
			border: 1px solid var(--border);
			cursor: pointer;
			transition: all 0.15s;
		}

		.harmony-swatch:hover {
			transform: scale(1.15);
			border-color: var(--cyan);
			z-index: 1;
		}

		/* -- Contrast -- */
		.contrast-row {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 5px 0;
		}

		.contrast-row + .contrast-row { border-top: 1px solid var(--border); }

		.contrast-preview {
			width: 26px;
			height: 26px;
			border-radius: 5px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 10px;
			font-weight: 700;
			flex-shrink: 0;
			border: 1px solid var(--border);
		}

		.contrast-info { flex: 1; }

		.contrast-ratio {
			font-size: 12px;
			font-weight: 600;
			color: var(--text-heading);
		}

		.contrast-vs {
			font-size: 10px;
			color: var(--text-muted);
		}

		.contrast-badges { display: flex; gap: 3px; }

		.badge {
			font-size: 9px;
			font-weight: 700;
			padding: 1px 4px;
			border-radius: 3px;
			letter-spacing: 0.03em;
		}

		.badge.pass { background: rgba(74, 222, 128, 0.15); color: var(--green); }
		.badge.fail { background: rgba(248, 113, 113, 0.15); color: var(--red); }

		/* -- Shades -- */
		.shade-desc {
			font-size: 11px;
			color: var(--text-muted);
			margin-bottom: 8px;
			line-height: 1.4;
		}

		.shade-strip {
			display: flex;
			gap: 3px;
		}

		.shade-swatch {
			flex: 1;
			height: 28px;
			cursor: pointer;
			transition: transform 0.15s ease, box-shadow 0.15s ease;
			border: none;
			border-radius: 4px;
			padding: 0;
		}

		.shade-swatch:hover {
			transform: translateY(-3px) scale(1.08);
			z-index: 1;
			box-shadow: 0 4px 8px rgba(0,0,0,0.3);
		}

		.shade-swatch:active {
			transform: translateY(0) scale(1);
		}

		.shade-swatch.origin {
			height: 32px;
			margin-top: -2px;
		}

		.shade-labels {
			display: flex;
			justify-content: space-between;
			margin-top: 4px;
			font-size: 9px;
			color: var(--text-muted);
		}

		.shade-labels span:nth-child(2) {
			color: var(--cyan);
			font-weight: 600;
		}

		/* -- History -- */
		.history-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 8px 14px 5px;
			border-top: 1px solid var(--border);
		}

		.history-label {
			font-size: 10px;
			color: var(--text-muted);
			text-transform: uppercase;
			letter-spacing: 0.08em;
		}

		.clear-btn {
			background: none;
			border: none;
			color: var(--text-muted);
			font-size: 11px;
			cursor: pointer;
			padding: 2px 5px;
			border-radius: 4px;
			transition: all 0.15s;
		}

		.clear-btn:hover { color: var(--red); background: rgba(248, 113, 113, 0.1); }

		.clear-btn.confirm {
			color: var(--red);
			background: rgba(248, 113, 113, 0.15);
			font-weight: 600;
		}

		.history-list {
			padding: 0 14px 8px;
			display: flex;
			flex-direction: column;
			gap: 2px;
		}

		.history-item {
			display: flex;
			align-items: center;
			gap: 7px;
			padding: 4px 6px;
			border-radius: 5px;
			cursor: pointer;
			transition: all 0.12s;
		}

		.history-item:hover { background: var(--surface); }

		.history-swatch {
			width: 16px;
			height: 16px;
			border-radius: 3px;
			border: 1px solid var(--border);
			flex-shrink: 0;
		}

		.history-hex {
			font-size: 11px;
			color: var(--text);
			flex: 1;
		}

		.history-delete {
			background: none;
			border: none;
			color: var(--text-muted);
			cursor: pointer;
			padding: 2px;
			border-radius: 4px;
			opacity: 0;
			transition: all 0.12s;
			display: flex;
			align-items: center;
		}

		.history-item:hover .history-delete { opacity: 1; }
		.history-delete:focus-visible { opacity: 1; }
		.history-delete:hover { color: var(--red); background: rgba(248, 113, 113, 0.1); }
		.history-delete svg { width: 11px; height: 11px; }

		.empty-state {
			padding: 14px;
			text-align: center;
			color: var(--text-muted);
			font-size: 12px;
		}

		/* -- Footer -- */
		.footer {
			padding: 6px 14px 8px;
			border-top: 1px solid var(--border);
			text-align: center;
			flex-shrink: 0;
			transition: border-top-color 0.2s;
		}

		.footer a {
			color: var(--text-muted);
			text-decoration: none;
			font-size: 10px;
			transition: color 0.15s;
		}

		.footer a:hover { color: var(--cyan); }

		/* -- Two-Color Contrast -- */
		.contrast-2col { display: flex; flex-direction: column; gap: 8px; }

		.contrast-colors {
			display: flex;
			align-items: flex-end;
			gap: 6px;
		}

		.contrast-slot { flex: 1; display: flex; flex-direction: column; gap: 4px; }

		.contrast-slot-label {
			font-size: 9px;
			color: var(--text-muted);
			text-transform: uppercase;
			letter-spacing: 0.05em;
		}

		.contrast-slot-swatch {
			height: 24px;
			border-radius: 5px;
			border: 1px solid var(--border);
		}

		.contrast-hex-input {
			width: 100%;
			background: var(--surface);
			border: 1px solid var(--border);
			color: var(--text-heading);
			font-size: 11px;
			padding: 4px 6px;
			border-radius: 5px;
			text-align: center;
			transition: border-color 0.15s;
		}

		.contrast-hex-input:focus {
			border-color: var(--cyan);
			outline: none;
		}

		.contrast-swap {
			background: none;
			border: 1px solid var(--border);
			border-radius: 5px;
			color: var(--text-muted);
			cursor: pointer;
			padding: 4px;
			margin-bottom: 1px;
			display: flex;
			align-items: center;
			transition: all 0.15s;
			flex-shrink: 0;
		}

		.contrast-swap:hover { color: var(--cyan); border-color: var(--cyan); }
		.contrast-swap svg { width: 14px; height: 14px; }

		.contrast-result-preview {
			padding: 8px 12px;
			border-radius: 6px;
			border: 1px solid var(--border);
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.contrast-result-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
		}

		.contrast-ratio {
			font-size: 16px;
			font-weight: 700;
			color: var(--text-heading);
		}

		.contrast-badges { display: flex; gap: 3px; }

		/* -- Color Blindness -- */
		.cb-row {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 6px 0;
			cursor: pointer;
			border-radius: 5px;
			transition: background 0.12s;
		}

		.cb-row:hover { background: var(--surface); margin: 0 -6px; padding: 6px 6px; }

		.cb-row + .cb-row { border-top: 1px solid var(--border); }

		.cb-swatches {
			display: flex;
			align-items: center;
			gap: 4px;
			flex-shrink: 0;
		}

		.cb-swatch {
			width: 24px;
			height: 24px;
			border-radius: 5px;
			border: 1px solid var(--border);
		}

		.cb-arrow {
			width: 12px;
			height: 12px;
			color: var(--text-muted);
		}

		.cb-info { flex: 1; min-width: 0; }
		.cb-type { font-size: 12px; font-weight: 600; color: var(--text-heading); }
		.cb-desc { font-size: 10px; color: var(--text-muted); }

		/* -- Copy Toast -- */
		.copy-toast {
			position: fixed;
			bottom: 0;
			left: 0;
			right: 0;
			background: var(--teal);
			color: #0B0A23;
			text-align: center;
			padding: 7px 14px;
			font-weight: 600;
			font-size: 12px;
			z-index: 100;
			transform: translateY(100%);
			transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
		}

		.copy-toast.show {
			transform: translateY(0);
		}

		/* -- Unsupported -- */
		.unsupported {
			padding: 16px;
			text-align: center;
			color: var(--text-muted);
		}

		.unsupported-title {
			color: var(--red);
			font-weight: 600;
			margin-bottom: 8px;
		}

		/* -- Scrollbar -- */
		.below-pick::-webkit-scrollbar { width: 6px; }
		.below-pick::-webkit-scrollbar-track { background: transparent; margin: 4px 0; }
		.below-pick::-webkit-scrollbar-thumb {
			background: var(--border);
			border-radius: 3px;
			border: 1px solid var(--bg);
		}
		.below-pick::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

		/* -- Animations -- */
		.fade-in {
			animation: fadeIn 0.3s ease;
		}

		@keyframes fadeIn {
			from { opacity: 0; transform: translateY(-4px); }
			to { opacity: 1; transform: translateY(0); }
		}
	</style>
</head>

					<div class="swatch-hex mono" id="hexDisplay"></div>
				</div>

						<svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>

						<span class="format-value mono" id="rgbValue"></span>
						<svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>

					</div>
					<div class="format-row" role="button" tabindex="0" data-format="oklch" aria-label="Copy OKLCH value">
						<span class="format-label mono" style="min-width:38px">OKLCH</span>
						<span class="format-value mono" id="oklchValue"></span>
						<svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
					</div>
					</div>
			</div>

					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
				</button>
				<div class="section-body" id="harmoniesBody"></div>
			</div>

			<div class="section hidden" id="shadesSection">
				<button class="section-toggle mono" id="shadesToggle" aria-expanded="false">
					Shades &amp; Tints
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
				</button>
				<div class="section-body" id="shadesBody"></div>
			</div>

			</div>

			<div class="section hidden" id="cbSection">

				<div class="section-body" id="cbBody"></div>
			</div>
